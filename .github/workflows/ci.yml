name: NSRL MySQL Database CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: local-test-password
          MYSQL_DATABASE: ci_nsrl
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -p'local-test-password'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: '3306'
      MYSQL_USER: root
      MYSQL_PASSWORD: local-test-password
      MYSQL_DATABASE: ci_nsrl
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt cfn-lint
      - run: python -m unittest discover -s tests -v
      - run: cfn-lint infra/*.yaml
      - run: python scripts/test_database.py
