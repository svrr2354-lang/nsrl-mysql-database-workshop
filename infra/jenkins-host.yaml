AWSTemplateFormatVersion: '2010-09-09'
Description: Dedicated private-access Jenkins host and RDS DB subnet group for the NSRL MySQL Database Workshop
Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Select at least two public subnets in different Availability Zones of this VPC.
  JenkinsInstanceType:
    Type: String
    Default: t3.small
    AllowedValues: [t3.small, t3.medium]
  JenkinsAmi:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
  LabInstanceProfile:
    Type: String
    Default: LabInstanceProfile
Resources:
  BootstrapBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
  JenkinsLogin:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: NSRL MySQL workshop Jenkins admin credentials
      GenerateSecretString:
        SecretStringTemplate: '{"username":"workshop_admin"}'
        GenerateStringKey: password
        PasswordLength: 30
        ExcludePunctuation: true
  JenkinsSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: No inbound ports - Jenkins is reached privately through AWS Systems Manager Session Manager
      VpcId: !Ref VpcId
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: NSRL MySQL workshop RDS subnet group across at least two AZs
      SubnetIds: !Ref SubnetIds
  JenkinsHost:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref JenkinsAmi
      InstanceType: !Ref JenkinsInstanceType
      IamInstanceProfile: !Ref LabInstanceProfile
      MetadataOptions:
        HttpTokens: required
        HttpPutResponseHopLimit: 2
      NetworkInterfaces:
        - DeviceIndex: '0'
          AssociatePublicIpAddress: true
          SubnetId: !Select [0, !Ref SubnetIds]
          GroupSet: [!Ref JenkinsSG]
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 20
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: nsrl-mysql-jenkins
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
          dnf install -y docker unzip git
          systemctl enable --now docker
          systemctl enable --now amazon-ssm-agent
          mkdir -p /opt/nsrl-mysql-workshop
          echo '${JenkinsLogin}' > /opt/nsrl-mysql-workshop/login-secret-arn
          chmod 600 /opt/nsrl-mysql-workshop/login-secret-arn
Outputs:
  JenkinsInstanceId:
    Value: !Ref JenkinsHost
  JenkinsSecurityGroupId:
    Value: !Ref JenkinsSG
  DBSubnetGroupName:
    Value: !Ref DBSubnetGroup
  BootstrapBucketName:
    Value: !Ref BootstrapBucket
  JenkinsLoginSecretArn:
    Value: !Ref JenkinsLogin
  VpcId:
    Value: !Ref VpcId
